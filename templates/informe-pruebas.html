<template id="informe-template">
  <section class="informe">
    <header class="informe__head">
      <h1 class="informe__titulo">Informe de pruebas de certificación</h1>
      <p class="informe__meta" data-informe-meta></p>
    </header>
    <p class="informe__resumen" data-informe-resumen></p>
    <table class="informe__tabla">
      <caption class="informe__caption">Resultados por enlace</caption>
      <thead>
        <tr>
          <th scope="col">Enlace</th>
          <th scope="col">Mapa</th>
          <th scope="col">Long. (m)</th>
          <th scope="col">Aten. (dB)</th>
          <th scope="col">NEXT (dB)</th>
          <th scope="col">Retorno (dB)</th>
          <th scope="col">Resultado</th>
          <th scope="col">Fecha</th>
        </tr>
      </thead>
      <tbody data-informe-filas></tbody>
    </table>
    <footer class="informe__pie" data-informe-pie></footer>
  </section>
</template>

<template id="informe-fila">
  <tr>
    <td data-inf-link></td>
    <td data-inf-mapa></td>
    <td data-inf-long></td>
    <td data-inf-aten></td>
    <td data-inf-next></td>
    <td data-inf-retorno></td>
    <td data-inf-resultado></td>
    <td data-inf-fecha></td>
  </tr>
</template>

<style id="informe-styles">

  .informe__titulo {
    margin: 0 0 2mm;
    font-size: 6mm;

  }

    margin: 0 0 4mm;
    font-size: 3.2mm;
    color: #475569;
  }

    font-size: 3.6mm;
    font-weight: 600;
  }

  .informe__tabla {
    width: 100%;
    border-collapse: collapse;
    font-size: 3.2mm;
  }

  .informe__caption {
    margin-bottom: 2mm;
    text-align: left;
    font-size: 3.2mm;
    color: #475569;
  }

  .informe__tabla th,
  .informe__tabla td {
